[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[project]
name = "scim2-flask"
version = "0.0.0"
description = "Painless SCIM integration for Flask"
authors = [
    { name = "Éloi Rivard", email = "eloi@yaal.coop" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["scim", "scim2", "provisioning", "flask", "rfc7643", "rfc7644"]
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "scim2-models>=0.8.0",
]

[project.urls]
repository = "https://github.com/python-scim/scim2-flask"

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "prek>=0.5.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "scim2-tester>=0.4.0",
]

[tool.ruff.lint]
select = [
    "B", # flake8-bugbear
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # line-too-long
    "E722", # bare-except
    "D100", # public module
    "D101", # public class
    "D102", # public method
    "D103", # public function
    "D104", # public package
    "D105", # magic method
    "D106", # nested class
    "D107", # public init
    "D203", # no-blank-line-before-class
    "D213", # multi-line-summary-second-line
]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.format]
docstring-code-format = true

[tool.coverage.run]
source = ["scim2_flask", "examples", "tests"]

[tool.pytest.ini_options]
pythonpath = ["."]
